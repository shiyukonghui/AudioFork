[package]
name = "audio_router"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ringbuf = "0.5"
rubato = "2"
crossbeam-channel = "0.5"
egui = "0.31"
eframe = "0.31"
rfd = "0.15"
sysinfo = "0.33"
wasapi = { version = "0.22", optional = true }

[features]
default = []
wasapi-exclusive = ["dep:wasapi"]
